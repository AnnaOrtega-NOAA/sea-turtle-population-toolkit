name: Publish vignette

on:
  push:
    branches: [main]
    paths:
      - "vignette/**"
      - ".github/workflows/publish-vignette.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.8.24"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Render vignette
        working-directory: vignette
        run: quarto render

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: vignette/_site

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
